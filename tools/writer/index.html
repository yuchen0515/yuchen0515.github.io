<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="writer-token" content="__WRITER_TOKEN__">
  <title>寫作桌 · Owen Lin</title>
  <link rel="stylesheet" href="/writer.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="desk-header">
    <div class="identity"><span class="monogram" aria-hidden="true">O.</span><div><h1>寫作桌</h1><p>Owen Lin <span aria-hidden="true">/</span> 本機 Markdown 編輯</p></div></div>
    <button id="new-draft" class="button secondary" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新增草稿</button>
  </header>
  <div class="desk">
    <aside class="library" aria-label="文章清單">
      <div class="library-tools"><label class="search-label" for="filter">尋找文章</label><button id="reload-library" type="button" class="reload-button" aria-label="重新讀取文章清單"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.5 0 4.9 1 6.7 2.8L21 8M21 3v5h-5"/></svg></button></div>
      <input id="filter" type="search" placeholder="輸入檔名" autocomplete="off">
      <div id="library" aria-live="polite"><p class="quiet">正在讀取文章…</p></div>
      <p class="library-note">草稿儲存在 <code>source/_drafts</code>。儲存不會觸發網站發佈。</p>
    </aside>
    <main class="workspace">
      <div class="document-bar">
        <div class="document-name"><span id="kind" class="kind">尚未選擇</span><h2 id="document-name">開啟文章，開始寫作</h2></div>
        <div class="actions">
          <select id="preview-language" aria-label="預覽語言" hidden><option value="zh">繁體中文</option><option value="en">English</option></select>
          <button id="attach-image" class="button secondary" aria-label="加入圖片" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg><span>加入圖片</span></button>
          <button id="save" class="button primary" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12l4 4v12a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>儲存</button>
          <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
        </div>
      </div>
      <div class="view-tabs" role="tablist" aria-label="編輯畫面">
        <button type="button" role="tab" id="edit-tab" aria-selected="true" aria-controls="editor-panel">Markdown</button>
        <button type="button" role="tab" id="preview-tab" aria-selected="false" aria-controls="preview-panel">預覽</button>
      </div>
      <div class="panes">
        <section class="editor-panel" id="editor-panel" aria-label="Markdown 編輯區">
          <div class="pane-label"><label for="editor">Markdown 原文</label><span>保留完整 frontmatter</span></div>
          <textarea id="editor" aria-label="Markdown 原文" spellcheck="false" disabled placeholder="從左側開啟文章，或新增草稿。"></textarea>
        </section>
        <section class="preview-panel" id="preview-panel" aria-label="文章預覽區">
          <div class="pane-label"><span>文章預覽</span><span>與網站使用相同 renderer</span></div>
          <iframe id="preview" title="文章預覽" sandbox="allow-same-origin" referrerpolicy="no-referrer"></iframe>
        </section>
      </div>
      <footer class="status-bar"><p id="status" role="status" aria-live="polite">文章與圖片保留在你的本機。</p><p class="hint">貼上或拖入圖片 <span aria-hidden="true">·</span> <kbd>⌘</kbd>/<kbd>Ctrl</kbd> + <kbd>S</kbd> 儲存</p></footer>
      <p id="error" class="error" role="alert" hidden></p>
    </main>
  </div>
  <dialog id="draft-dialog" aria-labelledby="draft-heading">
    <form id="draft-form">
      <h2 id="draft-heading">新的草稿</h2>
      <p>先給文章一個標題。之後可以直接在 Markdown 裡修改。</p>
      <label for="draft-title">文章標題</label>
      <input id="draft-title" name="title" type="text" maxlength="200" required autocomplete="off">
      <p id="draft-error" class="error" role="alert" hidden></p>
      <div class="dialog-actions"><button id="cancel-draft" class="button secondary" type="button">取消</button><button id="create-draft" class="button primary" type="submit">建立草稿</button></div>
    </form>
  </dialog>
</body>
</html>
